name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      # Le healthcheck n'a besoin d'aucun token : il monte tout le câblage
      # (base temporaire, services, commandes, événements) sans se connecter à Discord.
      - name: Healthcheck (sans Discord)
        run: npm run check

  docker:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: inspecteur-gadget:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérifier l'image (healthcheck hors ligne)
        run: docker run --rm inspecteur-gadget:ci node scripts/healthcheck.js
